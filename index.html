<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Healthamily · 우리 가족 성장 기록</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --ink:#191f28;
    --muted:#8b95a1;
    --line:#f2f3f5;
    --accent:#16a34a;
    --accent-soft:#e8f7ee;
    --clay:#f97316;
    --danger:#ef4444;
    --danger-soft:#fdeaea;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:36px 22px 90px;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:36px;
  }
  header.top h1{
    font-size:22px;
    margin:0;
    color:var(--ink);
  }
  header.top h1 span{color:var(--accent);}
  .subtitle{
    font-size:13px;
    color:var(--muted);
    margin-top:3px;
    font-weight:500;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:26px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(25,31,40,0.04);
  }
  .section-label{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin:28px 0 12px;
  }
  .section-label:first-child{margin-top:0;}
  .member-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .member-row:last-child{border-bottom:none;}
  .member-row .left{display:flex; align-items:center; gap:14px;}
  .avatar{
    width:44px; height:44px;
    border-radius:50%;
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    flex-shrink:0;
  }
  .avatar.lg{width:60px; height:60px; font-size:30px;}
  .member-row .name{font-weight:700; font-size:16px;}
  .member-row .meta{font-size:12.5px; color:var(--muted); margin-top:2px; font-weight:500;}
  .member-row .chev{color:var(--muted); font-size:18px;}
  button.primary{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:15px 18px;
    border-radius:14px;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    width:100%;
    box-shadow:0 4px 12px rgba(22,163,74,0.22);
  }
  button.primary:active{opacity:.85;}
  button.danger{
    background:var(--danger-soft);
    color:var(--danger);
    border:none;
    padding:15px 18px;
    border-radius:14px;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    width:100%;
  }
  button.danger:active{opacity:.85;}
  button.ghost{
    background:var(--accent-soft);
    border:none;
    color:var(--accent);
    padding:11px 16px;
    border-radius:12px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  button.link{
    background:none;
    border:none;
    color:var(--muted);
    text-decoration:underline;
    font-size:12px;
    cursor:pointer;
    padding:4px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    margin:16px 0 6px;
  }
  input, select{
    width:100%;
    padding:13px 14px;
    border:1px solid var(--line);
    border-radius:12px;
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    background:#f9fafb;
  }
  input:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}
  .back-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--muted);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    padding:0 0 20px;
  }
  .emoji-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:8px;
    margin-top:6px;
  }
  .emoji-grid button{
    background:#f9fafb;
    border:1px solid var(--line);
    border-radius:12px;
    font-size:20px;
    padding:8px 0;
    cursor:pointer;
  }
  .emoji-grid button.selected{
    background:var(--accent-soft);
    border-color:var(--accent);
  }
  .marks-list{
    margin-top:18px;
  }
  .marks-list .mark{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .marks-list .mark:last-child{border-bottom:none;}
  .marks-list .mark .label{
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
  }
  .marks-list .mark .date{
    font-size:12px;
    color:var(--muted);
    font-weight:500;
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
  }
  .stat-box{
    background:#f9fafb;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
  }
  .stat-box .num{
    font-size:21px;
    font-weight:800;
    color:var(--ink);
  }
  .stat-box.clay .num{color:var(--clay);}
  .stat-box .lbl{
    font-size:11.5px;
    color:var(--muted);
    margin-top:3px;
    font-weight:600;
  }
  .note{
    font-size:12px;
    color:var(--muted);
    background:var(--accent-soft);
    padding:11px 14px;
    border-radius:12px;
    margin-top:16px;
    line-height:1.55;
    font-weight:500;
  }
  .chart-box{
    margin-top:16px;
    background:#f9fafb;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 12px;
  }
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty .display{
    color:var(--ink);
    font-size:20px;
    margin-bottom:8px;
  }
  .modal-bg{
    position:fixed; inset:0;
    background:rgba(25,31,40,0.4);
    display:flex; align-items:flex-end;
    z-index:50;
  }
  .modal{
    background:#fff;
    width:100%;
    border-radius:26px 26px 0 0;
    padding:26px 22px 34px;
    max-height:88vh;
    overflow-y:auto;
  }
  .modal h3{margin:0 0 4px; font-size:19px;}
  .modal-close{
    float:right;
    background:none;border:none;
    font-size:20px;color:var(--muted);
    cursor:pointer;
  }
  .loading{
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
    font-size:14px;
    font-weight:500;
  }
  .toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    z-index:100;
    box-shadow:0 8px 20px rgba(0,0,0,0.18);
  }
  .delete-x{
    background:none;border:none;color:var(--muted);
    font-size:15px; cursor:pointer; padding:4px 8px;
  }
  .record-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    font-weight:500;
  }
  .record-item:last-child{border-bottom:none;}
  .summary-row{
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-name{
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
  }
  .summary-value{
    font-size:12.5px;
    font-weight:700;
    color:var(--accent);
    margin-top:2px;
  }
  .confirm-modal{
    background:#fff;
    border-radius:20px;
    padding:26px 22px;
    max-width:320px;
    width:88%;
    text-align:center;
  }
  .confirm-modal h3{font-size:17px; margin:0 0 8px;}
  .confirm-modal p{font-size:13.5px; color:var(--muted); margin:0 0 20px; line-height:1.5;}
  .confirm-btns{display:flex; gap:10px;}
  .confirm-btns button{flex:1;}
  .lock-screen{
    position:fixed; inset:0;
    background:#fff;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:24px;
    z-index:200;
  }
  .lock-screen img{ height:64px; margin-bottom:28px; }
  .lock-screen .pin-hint{
    font-size:13.5px; color:var(--muted); font-weight:500; margin-bottom:18px;
  }
  .lock-screen input{
    width:180px;
    text-align:center;
    font-size:24px;
    letter-spacing:10px;
    padding:14px 0;
  }
  .lock-screen button{
    width:180px;
    margin-top:14px;
  }
  .lock-screen .pin-error{
    color:var(--danger);
    font-size:12.5px;
    font-weight:600;
    margin-top:12px;
    min-height:16px;
  }
</style>
</head>

function interp(xs, ys, x){
  if(x<=xs[0]) return ys[0];
  if(x>=xs[xs.length-1]) return ys[ys.length-1];

// 대략적 백분위 추정 (정규분포 근사, CV 고정치 사용 — 참고용)
function estimatePercentile(value, mean, cvPercent){
  const sd = mean * (cvPercent/100);
  const z = (value-mean)/sd;
  // 표준정규 CDF 근사
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989423*Math.exp(-z*z/2);
  let p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  p = z>0 ? 1-p : p;
  return Math.round(p*100);
}

function calcBMI(weightKg, heightCm){
  if(!weightKg || !heightCm) return null;
  const h = heightCm/100;
  return Math.round((weightKg/(h*h))*10)/10;
}

function bmiCategory(bmi){
  if(bmi<18.5) return '저체중';
  if(bmi<23) return '정상';
  if(bmi<25) return '과체중';
  return '비만';
}

function ageInMonths(birthDate, atDate){
  const b = new Date(birthDate), a = new Date(atDate);
  return (a.getFullYear()-b.getFullYear())*12 + (a.getMonth()-b.getMonth()) + (a.getDate()-b.getDate())/30;
}

function fmtDate(d){
  const dt = new Date(d);
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}

/* ---------- state ---------- */
let members = [];
let records = {}; // memberId -> [records] sorted by date asc
let milestones = {}; // memberId -> [milestones] sorted by date asc
let workouts = {}; // memberId -> [workouts] sorted by date asc
let currentView = { name:'list' }; // list | detail | addMember | addRecord
let unsubMembers = null;
let recordUnsubs = {};
let milestoneUnsubs = {};
let workoutUnsubs = {};

const membersCol = collection(db, 'members');

function listenMembers(){
  unsubMembers = onSnapshot(query(membersCol, orderBy('createdAt','asc')), (snap)=>{
    members = snap.docs.map(d=>({id:d.id, ...d.data()}));
    members.forEach(m=>{
      if(!recordUnsubs[m.id]) listenRecords(m.id);
      if(m.type==='child' && !milestoneUnsubs[m.id]) listenMilestones(m.id);
      if(m.type==='parent' && !workoutUnsubs[m.id]) listenWorkouts(m.id);
    });
    render();
  });
}

function listenRecords(memberId){
  const col = collection(db, 'members', memberId, 'records');
  recordUnsubs[memberId] = onSnapshot(query(col, orderBy('date','asc')), (snap)=>{
    records[memberId] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

function listenMilestones(memberId){
  const col = collection(db, 'members', memberId, 'milestones');
  milestoneUnsubs[memberId] = onSnapshot(query(col, orderBy('date','asc')), (snap)=>{
    milestones[memberId] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

function listenWorkouts(memberId){
  const col = collection(db, 'members', memberId, 'workouts');
  workoutUnsubs[memberId] = onSnapshot(query(col, orderBy('date','asc')), (snap)=>{
    workouts[memberId] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

async function addMember(data){
  await addDoc(membersCol, {...data, createdAt: serverTimestamp()});
}

async function updateMember(memberId, data){
  await setDoc(doc(db, 'members', memberId), data, { merge: true });
}

async function addRecord(memberId, data){
  const col = collection(db, 'members', memberId, 'records');
  await addDoc(col, data);
}

async function addMilestone(memberId, data){
  const col = collection(db, 'members', memberId, 'milestones');
  await addDoc(col, data);
}

async function removeMilestone(memberId, milestoneId){
  await deleteDoc(doc(db, 'members', memberId, 'milestones', milestoneId));
}

async function addWorkout(memberId, data){
  const col = collection(db, 'members', memberId, 'workouts');
  await addDoc(col, data);
}

async function removeWorkout(memberId, workoutId){
  await deleteDoc(doc(db, 'members', memberId, 'workouts', workoutId));
}

async function removeRecord(memberId, recordId){
  await deleteDoc(doc(db, 'members', memberId, 'records', recordId));
}

async function removeMember(memberId){
  await deleteDoc(doc(db, 'members', memberId));
}

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ---------- render ---------- */
function render(){
  const el = document.getElementById('app');
  if(currentView.name==='list') el.innerHTML = renderList();
  else if(currentView.name==='detail') el.innerHTML = renderDetail(currentView.memberId);
  el.innerHTML += renderModals();
  bindEvents();
  if(currentView.name==='detail'){
    const m = members.find(x=>x.id===currentView.memberId);
    if(m) drawChart(m);
  }
}

function renderFamilySummary(){
  if(members.length===0) return '';
  const now = new Date();
  const cutoff = new Date(now.getTime() - 30*24*60*60*1000);

  const lines = [];
  members.forEach(m=>{
    const recs = (records[m.id]||[]).filter(r=>r.height!=null || r.weight!=null);
    if(recs.length===0) return;
    const recent = recs.filter(r=>new Date(r.date) >= cutoff);
    const last = recs[recs.length-1];

    if(m.type==='child'){
      if(recent.length>1){
        const first = recent[0];
        const hDiff = (last.height && first.height) ? (last.height-first.height).toFixed(1) : null;
        if(hDiff!==null){
          lines.push(`<div class="summary-row"><div class="summary-name">${m.emoji||'🧒'} ${m.name}</div><div class="summary-value">최근 30일 +${hDiff}cm</div></div>`);
        }
      }
    } else {
      const wt = workouts[m.id]||[];
      const recentWorkouts = wt.filter(w=>new Date(w.date) >= cutoff);
      const totalMin = recentWorkouts.reduce((s,w)=>s+(w.minutes||0),0);
      const totalCal = recentWorkouts.reduce((s,w)=>s+(w.calories||0),0);
      let weightPart = '';
      if(m.targetWeight && last.weight){
        const remaining = (last.weight - m.targetWeight).toFixed(1);
        weightPart = `목표까지 ${remaining>0?remaining:0}kg`;
      } else if(last.weight){
        weightPart = `${last.weight}kg`;
      }
      lines.push(`<div class="summary-row"><div class="summary-name">${m.emoji||'🙂'} ${m.name}</div><div class="summary-value">${weightPart}${recentWorkouts.length>0?` · 운동 ${recentWorkouts.length}회(${totalMin}분${totalCal>0?`,${totalCal}kcal`:''})`:''}</div></div>`);
    }
  });

  if(lines.length===0) return '';
  return `
    <div class="card">
      <h3 style="margin:0 0 10px;font-size:15px;">최근 30일 가족 요약</h3>
      ${lines.join('')}
    </div>`;
}

function renderList(){
  const children = members.filter(m=>m.type==='child');
  const parents = members.filter(m=>m.type==='parent');
  const renderRow = (m)=>{
    const recs = records[m.id]||[];
    const last = recs[recs.length-1];
    const metaText = last ? `최근 ${fmtDate(last.date)} · ${last.height?last.height+'cm ':''}${last.weight?last.weight+'kg':''}` : '기록 없음';
    return `
      <div class="member-row" data-open="${m.id}">
        <div class="left">
          <div class="avatar">${m.emoji||(m.type==='child'?'🧒':'🙂')}</div>
          <div>
            <div class="name">${m.name}</div>
            <div class="meta">${metaText}</div>
          </div>
        </div>
        <div class="chev">›</div>
      </div>`;
  };

  return `
    ${renderHeader()}
    ${renderFamilySummary()}
    <button class="ghost" id="btn-meal-picker" style="width:100%;margin-bottom:20px;">🍽️ 오늘 저녁 뭐 먹지?</button>
    ${members.length===0 ? `
      <div class="empty">

function buildProfileShareText(m){
  const recs = records[m.id]||[];
  const last = recs[recs.length-1];
  const lines = [];
  lines.push('🌱 Healthamily');
  lines.push(`${m.emoji||(m.type==='child'?'🧒':'🙂')} ${m.name} 프로필`);
  lines.push('');
  if(m.birthDate) lines.push(`생년월일: ${m.birthDate}`);
  if(m.gender) lines.push(`성별: ${m.gender==='male'?'남':'여'}`);
  if(m.avoidIngredients && m.avoidIngredients.length>0){
    lines.push(`기피 식단: ${m.avoidIngredients.map(a=>`${ALLERGEN_TAGS[a]||''}${a}`).join(', ')}`);
  }
  if(last){
    lines.push('');
    lines.push(`최근 기록 (${fmtDate(last.date)})`);
    const height = last.height || m.height;
    if(height) lines.push(`키: ${height}cm`);
    if(last.weight) lines.push(`몸무게: ${last.weight}kg`);
    if(m.type==='child'){
      const stats = computeChildStats(m, recs);
      if(stats && stats.percentileHeight!=null){
        const topPercent = 100 - stats.percentileHeight;
        lines.push(`또래 대비 키: 상위 ${topPercent}% (추정치)`);
      }
    }
  }
  return lines.join('\n');
}

function computeChildStats(m, recs){
  if(recs.length===0) return null;
  const last = recs[recs.length-1];
  const prev = recs.length>1 ? recs[recs.length-2] : null;
  const first = recs[0];

  const heightDiff = prev ? (last.height - prev.height).toFixed(1) : null;
  const weightDiff = prev ? (last.weight - prev.weight).toFixed(1) : null;

  const totalDays = (new Date(last.date) - new Date(first.date))/(1000*60*60*24);
  const totalMonths = totalDays/30.4;
  const heightGrowth = last.height - first.height;
  const monthlyRate = totalMonths>0.5 ? (heightGrowth/totalMonths).toFixed(2) : null;

  let percentileHeight = null, percentileWeight = null;
  if(m.birthDate && m.gender){
    const ref = GROWTH_REF[m.gender];
    const ageM = ageInMonths(m.birthDate, last.date);
    const meanH = interp(ref.ages, ref.height, ageM);
    const meanW = interp(ref.ages, ref.weight, ageM);
    percentileHeight = estimatePercentile(last.height, meanH, 6);
    percentileWeight = estimatePercentile(last.weight, meanW, 13);
  }

  return { last, prev, heightDiff, weightDiff, monthlyRate, percentileHeight, percentileWeight };
}

  const m = members.find(x=>x.id===memberId);
  if(!m) return renderList();
  const recs = records[m.id]||[];
  const isChild = m.type==='child';
  const stats = isChild ? computeChildStats(m, recs) : null;

  let weightGoalBlock = '';
  if(!isChild && recs.length>0){
    const last = recs[recs.length-1];
    const first = recs[0];
    const bmiHeight = last.height || m.height;
    const bmi = calcBMI(last.weight, bmiHeight);
    const boxes = [];

    }
    if(m.targetWeight){
      const lost = (first.weight - last.weight).toFixed(1);
      const remaining = (last.weight - m.targetWeight).toFixed(1);
      boxes.push(`<div class="stat-box"><div class="num">${remaining>0?remaining:0}kg</div><div class="lbl">목표까지 남은 양</div></div>`);

    childStatBlock = `

        <div class="stat-box"><div class="num">${stats.last.height}cm</div><div class="lbl">현재 키 ${stats.heightDiff!==null?`(직전 대비 +${stats.heightDiff}cm)`:''}</div></div>

    <div class="record-item">
      <span>${fmtDate(r.date)} · ${r.height?r.height+'cm ':''}${r.weight?r.weight+'kg':''}${r.note?` <span style="color:var(--muted);">· ${r.note}</span>`:''}</span>

  let milestoneBlock = '';
  if(isChild){
    const ms = (milestones[m.id]||[]).slice().reverse();
    const items = ms.map(item=>{
      const emoji = MILESTONE_TYPES[item.type] || '⭐';

    const items = wt.map(w=>`
      <div class="record-item">
        <span>${WORKOUT_EMOJI[w.type]||'🏃'} ${w.type}${w.minutes?` · ${w.minutes}분`:''}${w.calories?` · 약 ${w.calories}kcal`:''} <span style="color:var(--muted);">· ${fmtDate(w.date)}</span></span>

      </div>
    `).join('') || '<div style="color:var(--muted);font-size:13px;">아직 운동 기록이 없어요</div>';
    workoutBlock = `

      </div>`;
  }

  return `
    <button class="back-btn" id="btn-back">← 목록으로</button>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">

  `;
}

function ageYM(birthDate, atDate){
  if(!birthDate) return null;
  const totalMonths = Math.floor(ageInMonths(birthDate, atDate));
  if(totalMonths<0) return null;
  const years = Math.floor(totalMonths/12);
  const rem = totalMonths%12;
  return years>0 ? `생후 ${years}년 ${rem}개월` : `생후 ${totalMonths}개월`;
}

function calcCalories(type, minutes, weightKg){
  if(!minutes || !weightKg) return null;
  const met = WORKOUT_TYPES[type];
  if(!met) return null;
  const hours = minutes/60;
  return Math.round(met * weightKg * hours);
}

function drawChart(m){
  const canvas = document.getElementById('growthChart');
  if(!canvas) return;
  const recs = records[m.id]||[];
  if(window._chartInstance) window._chartInstance.destroy();
  const labels = recs.map(r=>fmtDate(r.date));
  const isChild = m.type==='child';

  let datasets, scales;
  if(isChild){
    datasets = [
      {label:'키(cm)', data:recs.map(r=>r.height||null), borderColor:'#16a34a', backgroundColor:'#16a34a', tension:.3, yAxisID:'y'},
      {label:'몸무게(kg)', data:recs.map(r=>r.weight||null), borderColor:'#f97316', backgroundColor:'#f97316', tension:.3, yAxisID:'y1'}
    ];
    scales = {
      y:{position:'left', title:{display:true,text:'cm'}},
      y1:{position:'right', title:{display:true,text:'kg'}, grid:{drawOnChartArea:false}}
    };
  } else {
    datasets = [
      {label:'몸무게(kg)', data:recs.map(r=>r.weight||null), borderColor:'#f97316', backgroundColor:'#f97316', tension:.3, yAxisID:'y'}
    ];
    scales = { y:{position:'left', title:{display:true,text:'kg'}} };
    if(m.targetWeight){
      datasets.push({
        label:'목표 체중',
        data: recs.map(()=>m.targetWeight),
        borderColor:'#16a34a',
        borderDash:[6,4],
        pointRadius:0,
        yAxisID:'y'
      });
    }
  }

  window._chartInstance = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true,
      interaction:{mode:'index', intersect:false},
      plugins:{legend:{labels:{font:{family:'Work Sans'}}}},
      scales
    }
  });
}

function pickRandom(arr, n){
  const copy = arr.slice();
  const picked = [];
  while(copy.length>0 && picked.length<n){
    const idx = Math.floor(Math.random()*copy.length);
    picked.push(copy.splice(idx,1)[0]);
  }
  return picked;
}

function filterMeals(pool, maxSpice, avoidSet){
  return pool.filter(meal=>
    meal.spice <= maxSpice &&
    !meal.allergens.some(a=>avoidSet.has(a))
  );
}

function getMealRecommendation(selectedMembers){
  const children = selectedMembers.filter(m=>m.type==='child');
  const parents = selectedMembers.filter(m=>m.type==='parent');

  const result = {};
  if(children.length>0){
    const maxSpice = Math.min(...children.map(m=>m.spiceLevel ?? 1));
    const avoidSet = new Set(children.flatMap(m=>m.avoidIngredients||[]));
    result.childMeals = pickRandom(filterMeals(CHILD_MEALS, maxSpice, avoidSet), 3);
  }
  if(parents.length>0){
    const maxSpice = Math.min(...parents.map(m=>m.spiceLevel ?? 1));
    const avoidSet = new Set(parents.flatMap(m=>m.avoidIngredients||[]));
    result.parentMeals = pickRandom(filterMeals(PARENT_MEALS, maxSpice, avoidSet), 3);
  }
  return result;
}

      btn.classList.add('selected');
    };
  });

  document.querySelectorAll('#f-avoid-grid button, #e-avoid-grid button').forEach(btn=>{
    btn.onclick = ()=>{ btn.classList.toggle('selected'); };
  });

  const saveMemberBtn = document.getElementById('save-member');
  if(saveMemberBtn) saveMemberBtn.onclick = async ()=>{
    const type = document.getElementById('f-type').value;
    const name = document.getElementById('f-name').value.trim();

    const data = { type, name, emoji: selectedEmojiBtn ? selectedEmojiBtn.dataset.emoji : EMOJI_SET[0] };

      data.birthDate = document.getElementById('f-birth').value || null;
      data.gender = document.getElementById('f-gender').value;

      const t = document.getElementById('f-target').value;
      data.height = h ? parseFloat(h) : null;
      data.targetWeight = t ? parseFloat(t) : null;
    }
    data.spiceLevel = parseInt(document.getElementById('f-spice').value);
    data.avoidIngredients = Array.from(document.querySelectorAll('#f-avoid-grid button.selected')).map(b=>b.dataset.ingredient);
    await addMember(data);
    delete currentView.modal;
    showToast('가족 구성원을 추가했어요');
  };

  const addRecordBtn = document.getElementById('btn-add-record');
  if(addRecordBtn) addRecordBtn.onclick = ()=>{ currentView.modal='addRecord'; render(); };

  const saveRecordBtn = document.getElementById('save-record');
  if(saveRecordBtn) saveRecordBtn.onclick = async ()=>{
    const date = document.getElementById('r-date').value;
    const heightEl = document.getElementById('r-height');
    const height = heightEl ? heightEl.value : '';
    const weight = document.getElementById('r-weight').value;
    const note = document.getElementById('r-note').value.trim();
    if(!date || (!height && !weight)){ showToast('날짜와 기록할 값을 입력해주세요'); return; }
    const data = { date };
    if(height) data.height = parseFloat(height);
    if(weight) data.weight = parseFloat(weight);
    if(note) data.note = note;
    await addRecord(currentView.memberId, data);
    delete currentView.modal;
    showToast('기록을 저장했어요');
  };

  const msTypeSelect = document.getElementById('ms-type-select');
  if(msTypeSelect) msTypeSelect.onchange = (e)=>{
    document.getElementById('ms-custom-wrap').style.display = e.target.value==='__custom' ? 'block' : 'none';
  };

  const addMilestoneBtn = document.getElementById('btn-add-milestone');
  if(addMilestoneBtn) addMilestoneBtn.onclick = ()=>{ currentView.modal='addMilestone'; render(); };

  const saveMilestoneBtn = document.getElementById('save-milestone');
  if(saveMilestoneBtn) saveMilestoneBtn.onclick = async ()=>{
    const date = document.getElementById('ms-date').value;
    const selectVal = document.getElementById('ms-type-select').value;
    const type = selectVal==='__custom' ? document.getElementById('ms-type-custom').value.trim() : selectVal;
    const note = document.getElementById('ms-note').value.trim();
    if(!date || !type){ showToast('날짜와 항목을 입력해주세요'); return; }
    const data = { date, type };
    if(note) data.note = note;
    await addMilestone(currentView.memberId, data);
    delete currentView.modal;
    showToast('성장기록을 저장했어요');
  };

  document.querySelectorAll('[data-del-milestone]').forEach(elm=>{
    elm.onclick = async ()=>{
      const [memberId, msId] = elm.dataset.delMilestone.split('|');
      if(confirm('이 성장기록을 삭제할까요?')){
        await removeMilestone(memberId, msId);
        showToast('삭제했어요');
      }
    };
  });

  const wkTypeSelect = document.getElementById('wk-type-select');
  if(wkTypeSelect) wkTypeSelect.onchange = (e)=>{
    document.getElementById('wk-custom-wrap').style.display = e.target.value==='__custom' ? 'block' : 'none';
  };

  const addWorkoutBtn = document.getElementById('btn-add-workout');
  if(addWorkoutBtn) addWorkoutBtn.onclick = ()=>{ currentView.modal='addWorkout'; render(); };

  const saveWorkoutBtn = document.getElementById('save-workout');
  if(saveWorkoutBtn) saveWorkoutBtn.onclick = async ()=>{
    const date = document.getElementById('wk-date').value;
    const selectVal = document.getElementById('wk-type-select').value;
    const type = selectVal==='__custom' ? document.getElementById('wk-type-custom').value.trim() : selectVal;
    const minutes = document.getElementById('wk-minutes').value;
    if(!date || !type){ showToast('날짜와 운동 종류를 입력해주세요'); return; }
    const data = { date, type };
    if(minutes) data.minutes = parseInt(minutes);
    const memberRecs = records[currentView.memberId]||[];
    const lastWeight = memberRecs.length>0 ? memberRecs[memberRecs.length-1].weight : null;
    const cal = calcCalories(type, data.minutes, lastWeight);
    if(cal) data.calories = cal;
    await addWorkout(currentView.memberId, data);
    delete currentView.modal;
    showToast('운동 기록을 저장했어요');
  };

  document.querySelectorAll('[data-del-workout]').forEach(elm=>{
    elm.onclick = async ()=>{
      const [memberId, wkId] = elm.dataset.delWorkout.split('|');
      if(confirm('이 운동 기록을 삭제할까요?')){
        await removeWorkout(memberId, wkId);
        showToast('삭제했어요');
      }
    };
  });

  document.querySelectorAll('[data-del-record]').forEach(elm=>{
    elm.onclick = async ()=>{
      const [memberId, recordId] = elm.dataset.delRecord.split('|');
      if(confirm('이 기록을 삭제할까요?')){
        await removeRecord(memberId, recordId);
        showToast('기록을 삭제했어요');
      }
    };
  });

  const editMemberBtn = document.getElementById('btn-edit-member');
  if(editMemberBtn) editMemberBtn.onclick = ()=>{ currentView.modal='editMember'; render(); };

  const shareBtn = document.getElementById('btn-share-profile');
  if(shareBtn) shareBtn.onclick = async ()=>{
    const m = members.find(x=>x.id===currentView.memberId);
    if(!m) return;
    const text = buildProfileShareText(m);
    if(navigator.share){
      try{
        await navigator.share({ title: 'Healthamily 프로필', text });
      }catch(e){
        // 사용자가 공유 취소한 경우 등은 무시
      }
    } else if(navigator.clipboard){
      try{
        await navigator.clipboard.writeText(text);
        showToast('클립보드에 복사했어요. 카톡 등에 붙여넣어보세요');
      }catch(e){
        showToast('복사에 실패했어요');
      }
    } else {
      showToast('이 브라우저에서는 공유가 지원되지 않아요');
    }
  };

  const saveEditBtn = document.getElementById('save-edit-member');
  if(saveEditBtn) saveEditBtn.onclick = async ()=>{
    const m = members.find(x=>x.id===currentView.memberId);
    const name = document.getElementById('e-name').value.trim();
    if(!name){ showToast('이름을 입력해주세요'); return; }
    const selectedEmojiBtn = document.querySelector('#e-emoji-grid button.selected');
    const data = { name, emoji: selectedEmojiBtn ? selectedEmojiBtn.dataset.emoji : (m.emoji||EMOJI_SET[0]) };
    if(m.type==='child'){
      data.birthDate = document.getElementById('e-birth').value || null;
      data.gender = document.getElementById('e-gender').value;
    } else {
      const h = document.getElementById('e-height').value;
      const t = document.getElementById('e-target').value;
      data.height = h ? parseFloat(h) : null;
      data.targetWeight = t ? parseFloat(t) : null;
    }
    data.spiceLevel = parseInt(document.getElementById('e-spice').value);
    data.avoidIngredients = Array.from(document.querySelectorAll('#e-avoid-grid button.selected')).map(b=>b.dataset.ingredient);
    await updateMember(currentView.memberId, data);
    delete currentView.modal;
    showToast('프로필을 수정했어요');
  };

  const mealPickerBtn = document.getElementById('btn-meal-picker');
  if(mealPickerBtn) mealPickerBtn.onclick = ()=>{ currentView.modal='mealPicker'; render(); };

  const getMealBtn = document.getElementById('btn-get-meal');
  if(getMealBtn) getMealBtn.onclick = ()=>{
    const selectedIds = Array.from(document.querySelectorAll('[data-meal-member]:checked')).map(el=>el.dataset.mealMember);
    currentView.mealSelectedIds = selectedIds;
    const selectedMembers = members.filter(m=>selectedIds.includes(m.id));
    currentView.mealResult = getMealRecommendation(selectedMembers);
    currentView.modal = 'mealResult';
    render();
  };

  const mealAgainBtn = document.getElementById('btn-meal-again');
  if(mealAgainBtn) mealAgainBtn.onclick = ()=>{
    const selectedMembers = members.filter(m=>(currentView.mealSelectedIds||[]).includes(m.id));
    currentView.mealResult = getMealRecommendation(selectedMembers);
    render();
  };

  const delMemberBtn = document.getElementById('btn-del-member');
  if(delMemberBtn) delMemberBtn.onclick = ()=>{
    currentView.modal = 'confirmDeleteMember';
    render();
  };

  const cancelDeleteBtn = document.getElementById('cancel-delete-member');
  if(cancelDeleteBtn) cancelDeleteBtn.onclick = ()=>{ delete currentView.modal; render(); };

  const confirmDeleteBtn = document.getElementById('confirm-delete-member');
  if(confirmDeleteBtn) confirmDeleteBtn.onclick = async ()=>{
    const name = members.find(m=>m.id===currentView.memberId)?.name;
    await removeMember(currentView.memberId);
    currentView = {name:'list'};
    showToast(`${name}님을 삭제했어요`);
  };
}

let APP_PIN = null;
const DEFAULT_PIN = '0986';

async function initPin(){
  const ref = doc(db, 'settings', 'appPassword');
  try{
    const snap = await getDoc(ref);
    if(snap.exists() && snap.data().pin){
      APP_PIN = snap.data().pin;
    } else {
      APP_PIN = DEFAULT_PIN;
      await setDoc(ref, { pin: DEFAULT_PIN });
    }
  } catch(e){
    APP_PIN = DEFAULT_PIN;
  }
  const input = document.getElementById('pin-input');
  const btn = document.getElementById('pin-submit');
  input.disabled = false;
  btn.disabled = false;
  btn.textContent = '확인';
  input.focus();
}

function tryUnlock(){
  const input = document.getElementById('pin-input');
  const errorEl = document.getElementById('pin-error');
  if(APP_PIN!==null && input.value === APP_PIN){
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = '';
    listenMembers();
  } else {
    errorEl.textContent = '비밀번호가 올바르지 않아요';
    input.value = '';
    input.focus();
  }
}

document.getElementById('pin-submit').onclick = tryUnlock;
document.getElementById('pin-input').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') tryUnlock();
});
initPin();

</script>
