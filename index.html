<body>
<div class="wrap" id="app">
  <div class="loading">불러오는 중…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, getDocs, deleteDoc,
  query, orderBy, onSnapshot, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_W7nAX1EcGqGx6-Vk3AhILxA0cN6UmMI",
  authDomain: "healthamily-8cfd4.firebaseapp.com",
  projectId: "healthamily-8cfd4",
  storageBucket: "healthamily-8cfd4.firebasestorage.app",
  messagingSenderId: "1061969220182",
  appId: "1:1061969220182:web:0fd09db16b4bc9c94e21f7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ---------- 대략적 참고 성장 평균치 (질병관리청 공식 수치표가 아닌 근사 추정용) ---------- */
/* ages in months -> [heightCm, weightKg] approx mean, per sex. 참고용, 정확한 진단 아님. */
const GROWTH_REF = {
  male: {
    ages: [0,3,6,9,12,18,24,36,48,60,72,84,96,108,120,132,144,156,168,180,192,204,216],
    height: [50,61,68,72,76,82,87,96,103,110,116,122,128,134,141,149,158,166,171,173,174,174,174],
    weight: [3.4,6.4,8.4,9.9,10.2,11.5,13,15,17,19,22,25,29,33,38,44,51,58,63,66,68,69,70]
  },
  female: {
    ages: [0,3,6,9,12,18,24,36,48,60,72,84,96,108,120,132,144,156,168,180,192,204,216],
    height: [49,60,66,70,74,80,85,95,102,109,115,121,128,136,145,152,157,159,160,160,161,161,161],
    weight: [3.2,5.8,7.8,9.2,9.5,10.8,12.5,14.5,16.5,18.5,21,24,28,33,39,45,49,52,54,55,56,56,57]
  }
};

function interp(xs, ys, x){
  if(x<=xs[0]) return ys[0];
  if(x>=xs[xs.length-1]) return ys[ys.length-1];
  for(let i=0;i<xs.length-1;i++){
    if(x>=xs[i] && x<=xs[i+1]){
      const t=(x-xs[i])/(xs[i+1]-xs[i]);
      return ys[i]+t*(ys[i+1]-ys[i]);
    }
  }
  return ys[ys.length-1];
}

// 대략적 백분위 추정 (정규분포 근사, CV 고정치 사용 — 참고용)
function estimatePercentile(value, mean, cvPercent){
  const sd = mean * (cvPercent/100);
  const z = (value-mean)/sd;
  // 표준정규 CDF 근사
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989423*Math.exp(-z*z/2);
  let p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  p = z>0 ? 1-p : p;
  return Math.round(p*100);
}

function calcBMI(weightKg, heightCm){
  if(!weightKg || !heightCm) return null;
  const h = heightCm/100;
  return Math.round((weightKg/(h*h))*10)/10;
}

function bmiCategory(bmi){
  if(bmi<18.5) return '저체중';
  if(bmi<23) return '정상';
  if(bmi<25) return '과체중';
  return '비만';
}

function ageInMonths(birthDate, atDate){
  const b = new Date(birthDate), a = new Date(atDate);
  return (a.getFullYear()-b.getFullYear())*12 + (a.getMonth()-b.getMonth()) + (a.getDate()-b.getDate())/30;
}

function fmtDate(d){
  const dt = new Date(d);
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}

/* ---------- state ---------- */
let members = [];
let records = {}; // memberId -> [records] sorted by date asc
let currentView = { name:'list' }; // list | detail | addMember | addRecord
let unsubMembers = null;
let recordUnsubs = {};

const membersCol = collection(db, 'members');

function listenMembers(){
  unsubMembers = onSnapshot(query(membersCol, orderBy('createdAt','asc')), (snap)=>{
    members = snap.docs.map(d=>({id:d.id, ...d.data()}));
    members.forEach(m=>{
      if(!recordUnsubs[m.id]) listenRecords(m.id);
    });
    render();
  });
}

function listenRecords(memberId){
  const col = collection(db, 'members', memberId, 'records');
  recordUnsubs[memberId] = onSnapshot(query(col, orderBy('date','asc')), (snap)=>{
    records[memberId] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

async function addMember(data){
  await addDoc(membersCol, {...data, createdAt: serverTimestamp()});
}

async function updateMember(memberId, data){
  await setDoc(doc(db, 'members', memberId), data, { merge: true });
}

async function addRecord(memberId, data){
  const col = collection(db, 'members', memberId, 'records');
  await addDoc(col, data);
}

async function removeRecord(memberId, recordId){
  await deleteDoc(doc(db, 'members', memberId, 'records', recordId));
}

async function removeMember(memberId){
  await deleteDoc(doc(db, 'members', memberId));
}

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ---------- render ---------- */
function render(){
  const el = document.getElementById('app');
  if(currentView.name==='list') el.innerHTML = renderList();
  else if(currentView.name==='detail') el.innerHTML = renderDetail(currentView.memberId);
  el.innerHTML += renderModals();
  bindEvents();
  if(currentView.name==='detail'){
    const m = members.find(x=>x.id===currentView.memberId);
    if(m) drawChart(m);
  }
}

function renderHeader(){
  return `
    <header class="top">
      <div>
        <h1>Health<span>amily</span></h1>
        <div class="subtitle">우리 가족 성장 · 체중 기록</div>
      </div>
    </header>`;
}

function renderList(){
  const children = members.filter(m=>m.type==='child');
  const parents = members.filter(m=>m.type==='parent');
  const renderRow = (m)=>{
    const recs = records[m.id]||[];
    const last = recs[recs.length-1];
    const metaText = last ? `최근 ${fmtDate(last.date)} · ${last.height?last.height+'cm ':''}${last.weight?last.weight+'kg':''}` : '기록 없음';
    return `
      <div class="member-row" data-open="${m.id}">
        <div>
          <div class="name">${m.name} <span class="tag ${m.type}">${m.type==='child'?'자녀':'부모'}</span></div>
          <div class="meta">${metaText}</div>
        </div>
        <div style="font-size:20px;color:var(--muted);">›</div>
      </div>`;
  };

  return `
    ${renderHeader()}
    ${members.length===0 ? `
      <div class="empty">
        <div class="display">가족 구성원을 추가해보세요</div>
        <div>이름과 생년월일만 입력하면 바로 기록을 시작할 수 있어요.</div>
      </div>` : `
      ${children.length>0 ? `<h3 style="margin:6px 0 10px;font-size:14px;color:var(--muted);">자녀</h3>${children.map(renderRow).join('')}`:''}
      ${parents.length>0 ? `<h3 style="margin:18px 0 10px;font-size:14px;color:var(--muted);">부모</h3>${parents.map(renderRow).join('')}`:''}
    `}
    <div style="margin-top:20px;">
      <button class="primary" id="btn-add-member">+ 가족 구성원 추가</button>
    </div>
  `;
}

function computeChildStats(m, recs){
  if(recs.length===0) return null;
  const last = recs[recs.length-1];
  const prev = recs.length>1 ? recs[recs.length-2] : null;
  const first = recs[0];

  const heightDiff = prev ? (last.height - prev.height).toFixed(1) : null;
  const weightDiff = prev ? (last.weight - prev.weight).toFixed(1) : null;

  const totalDays = (new Date(last.date) - new Date(first.date))/(1000*60*60*24);
  const totalMonths = totalDays/30.4;
  const heightGrowth = last.height - first.height;
  const monthlyRate = totalMonths>0.5 ? (heightGrowth/totalMonths).toFixed(2) : null;

  let percentileHeight = null, percentileWeight = null;
  if(m.birthDate && m.gender){
    const ref = GROWTH_REF[m.gender];
    const ageM = ageInMonths(m.birthDate, last.date);
    const meanH = interp(ref.ages, ref.height, ageM);
    const meanW = interp(ref.ages, ref.weight, ageM);
    percentileHeight = estimatePercentile(last.height, meanH, 6);
    percentileWeight = estimatePercentile(last.weight, meanW, 13);
  }

  return { last, prev, heightDiff, weightDiff, monthlyRate, percentileHeight, percentileWeight };
}

function renderDetail(memberId){
  const m = members.find(x=>x.id===memberId);
  if(!m) return renderList();
  const recs = records[m.id]||[];
  const isChild = m.type==='child';
  const stats = isChild ? computeChildStats(m, recs) : null;

  let weightGoalBlock = '';
  if(!isChild && recs.length>0){
    const last = recs[recs.length-1];
    const first = recs[0];
    const bmiHeight = last.height || m.height;
    const bmi = calcBMI(last.weight, bmiHeight);
    const boxes = [];
    boxes.push(`<div class="stat-box"><div class="num">${last.weight}kg</div><div class="lbl">현재 체중</div></div>`);
    if(bmi){
      boxes.push(`<div class="stat-box clay"><div class="num">${bmi}</div><div class="lbl">BMI · ${bmiCategory(bmi)}</div></div>`);
    }
    if(m.targetWeight){
      const lost = (first.weight - last.weight).toFixed(1);
      const remaining = (last.weight - m.targetWeight).toFixed(1);
      boxes.push(`<div class="stat-box"><div class="num">${remaining>0?remaining:0}kg</div><div class="lbl">목표까지 남은 양</div></div>`);
      boxes.push(`<div class="stat-box"><div class="num">${lost>0?lost:0}kg</div><div class="lbl">지금까지 감량</div></div>`);
    }
    weightGoalBlock = `<div class="stat-grid">${boxes.join('')}</div>
      ${!bmiHeight ? `<div class="note">※ 키 정보가 없어 BMI를 계산할 수 없어요. 구성원 정보에서 키를 입력해주세요.</div>` : ''}`;
  }

  let childStatBlock = '';
  if(isChild && stats){
    const bmi = calcBMI(stats.last.weight, stats.last.height);
    childStatBlock = `
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${stats.last.height}cm</div><div class="lbl">현재 키 ${stats.heightDiff!==null?`(직전 대비 +${stats.heightDiff}cm)`:''}</div></div>
        <div class="stat-box clay"><div class="num">${stats.last.weight}kg</div><div class="lbl">현재 체중 ${stats.weightDiff!==null?`(직전 대비 ${stats.weightDiff>0?'+':''}${stats.weightDiff}kg)`:''}</div></div>
        ${bmi ? `<div class="stat-box"><div class="num">${bmi}</div><div class="lbl">BMI</div></div>`:''}
        ${stats.monthlyRate ? `<div class="stat-box"><div class="num">${stats.monthlyRate}cm</div><div class="lbl">월평균 키 성장 속도</div></div>`:''}
        ${stats.percentileHeight!==null ? `<div class="stat-box"><div class="num">${stats.percentileHeight}%</div><div class="lbl">또래 대비 키 백분위(추정)</div></div>`:''}
      </div>
      <div class="note">※ 백분위 수치는 질병관리청 공식 성장도표가 아닌 근사 추정값이에요. 정확한 판정이 필요하면 소아과 검진 시 확인해주세요.${bmi?' 소아 BMI는 성인 기준(저체중/정상/과체중/비만)과 다르게 해석되니 숫자만 참고해주세요.':''}</div>
    `;
  }

  const doorframeMarks = recs.slice().reverse().slice(0,8).map(r=>`
    <div class="mark">
      <div class="stub"></div>
      <span class="label">${r.height?r.height+' cm':''}${r.weight?' · '+r.weight+' kg':''}</span>
      <span class="date">${fmtDate(r.date)}</span>
    </div>
  `).join('') || `<div style="color:var(--muted);font-size:13px;padding:10px 0;">아직 기록이 없어요</div>`;

  const recordListItems = recs.slice().reverse().map(r=>`
    <div class="record-item">
      <span>${fmtDate(r.date)} · ${r.height?r.height+'cm ':''}${r.weight?r.weight+'kg':''}</span>
      <button class="delete-x" data-del-record="${m.id}|${r.id}">✕</button>
    </div>
  `).join('') || '<div style="color:var(--muted);font-size:13px;">기록 없음</div>';

  return `
    <button class="back-btn" id="btn-back">← 목록으로</button>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <h2 style="margin:0 0 4px;">${m.name}</h2>
          <div class="subtitle">${m.type==='child'?'자녀':'부모'} ${m.birthDate?`· ${m.birthDate}`:''} ${m.gender==='male'?'· 남':m.gender==='female'?'· 여':''}</div>
        </div>
        <button class="delete-x" id="btn-del-member" title="구성원 삭제">✕</button>
      </div>
      <button class="ghost" id="btn-edit-member" style="margin-top:10px;">프로필 수정</button>

      ${isChild ? childStatBlock : weightGoalBlock}

      ${recs.length>1 ? `<div class="chart-box"><canvas id="growthChart" height="160"></canvas></div>` : ''}

      <div class="doorframe">${doorframeMarks}</div>

      <button class="primary" id="btn-add-record" style="margin-top:6px;">+ 오늘 기록 추가</button>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px;font-size:15px;">전체 기록</h3>
      ${recordListItems}
    </div>
  `;
}

function renderModals(){
  if(currentView.modal==='addMember'){
    return `
      <div class="modal-bg" id="modal-bg">
        <div class="modal">
          <button class="modal-close" id="modal-close">✕</button>
          <h3>가족 구성원 추가</h3>
          <div class="subtitle">자녀는 생년월일과 성별을 입력하면 성장 비교가 가능해져요.</div>
          <label>구분</label>
          <select id="f-type">
            <option value="child">자녀</option>
            <option value="parent">부모</option>
          </select>
          <label>이름</label>
          <input id="f-name" placeholder="예: 하은" />
          <div id="child-fields">
            <label>생년월일</label>
            <input id="f-birth" type="date" />
            <label>성별</label>
            <select id="f-gender">
              <option value="male">남</option>
              <option value="female">여</option>
            </select>
          </div>
          <div id="parent-fields" style="display:none;">
            <label>키 (cm, BMI 계산용)</label>
            <input id="f-height" type="number" step="0.1" placeholder="예: 172" />
            <label>목표 체중 (kg, 선택)</label>
            <input id="f-target" type="number" step="0.1" placeholder="예: 68" />
          </div>
          <button class="primary" id="save-member" style="margin-top:18px;">추가하기</button>
        </div>
      </div>`;
  }
  if(currentView.modal==='addRecord'){
    const m = members.find(x=>x.id===currentView.memberId);
    const isChild = m && m.type==='child';
    return `
      <div class="modal-bg" id="modal-bg">
        <div class="modal">
          <button class="modal-close" id="modal-close">✕</button>
          <h3>기록 추가</h3>
          <label>날짜</label>
          <input id="r-date" type="date" value="${new Date().toISOString().slice(0,10)}" />
          ${isChild ? `
          <div class="row2">
            <div>
              <label>키 (cm)</label>
              <input id="r-height" type="number" step="0.1" placeholder="선택" />
            </div>
            <div>
              <label>몸무게 (kg)</label>
              <input id="r-weight" type="number" step="0.1" placeholder="선택" />
            </div>
          </div>` : `
          <label>몸무게 (kg)</label>
          <input id="r-weight" type="number" step="0.1" placeholder="예: 71.2" />
          `}
          <button class="primary" id="save-record" style="margin-top:18px;">저장하기</button>
        </div>
      </div>`;
  }
  if(currentView.modal==='editMember'){
    const m = members.find(x=>x.id===currentView.memberId);
    const isChild = m.type==='child';
    return `
      <div class="modal-bg" id="modal-bg">
        <div class="modal">
          <button class="modal-close" id="modal-close">✕</button>
          <h3>프로필 수정</h3>
          <div class="subtitle">${m.type==='child'?'자녀':'부모'} 정보 수정</div>
          <label>이름</label>
          <input id="e-name" value="${m.name}" />
          ${isChild ? `
          <label>생년월일</label>
          <input id="e-birth" type="date" value="${m.birthDate||''}" />
          <label>성별</label>
          <select id="e-gender">
            <option value="male" ${m.gender==='male'?'selected':''}>남</option>
            <option value="female" ${m.gender==='female'?'selected':''}>여</option>
          </select>
          ` : `
          <label>키 (cm, BMI 계산용)</label>
          <input id="e-height" type="number" step="0.1" value="${m.height||''}" placeholder="예: 172" />
          <label>목표 체중 (kg, 선택)</label>
          <input id="e-target" type="number" step="0.1" value="${m.targetWeight||''}" placeholder="예: 68" />
          `}
          <button class="primary" id="save-edit-member" style="margin-top:18px;">저장하기</button>
        </div>
      </div>`;
  }
  return '';
}

function drawChart(m){
  const canvas = document.getElementById('growthChart');
  if(!canvas) return;
  const recs = records[m.id]||[];
  if(window._chartInstance) window._chartInstance.destroy();
  const labels = recs.map(r=>fmtDate(r.date));
  const isChild = m.type==='child';

  let datasets, scales;
  if(isChild){
    datasets = [
      {label:'키(cm)', data:recs.map(r=>r.height||null), borderColor:'#3f6b53', backgroundColor:'#3f6b53', tension:.3, yAxisID:'y'},
      {label:'몸무게(kg)', data:recs.map(r=>r.weight||null), borderColor:'#d97a5c', backgroundColor:'#d97a5c', tension:.3, yAxisID:'y1'}
    ];
    scales = {
      y:{position:'left', title:{display:true,text:'cm'}},
      y1:{position:'right', title:{display:true,text:'kg'}, grid:{drawOnChartArea:false}}
    };
  } else {
    datasets = [
      {label:'몸무게(kg)', data:recs.map(r=>r.weight||null), borderColor:'#d97a5c', backgroundColor:'#d97a5c', tension:.3, yAxisID:'y'}
    ];
    scales = { y:{position:'left', title:{display:true,text:'kg'}} };
    if(m.targetWeight){
      datasets.push({
        label:'목표 체중',
        data: recs.map(()=>m.targetWeight),
        borderColor:'#5b7fa6',
        borderDash:[6,4],
        pointRadius:0,
        yAxisID:'y'
      });
    }
  }

  window._chartInstance = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true,
      interaction:{mode:'index', intersect:false},
      plugins:{legend:{labels:{font:{family:'Work Sans'}}}},
      scales
    }
  });
}

function bindEvents(){
  document.querySelectorAll('[data-open]').forEach(elm=>{
    elm.onclick = ()=>{ currentView = {name:'detail', memberId:elm.dataset.open}; render(); };
  });
  const back = document.getElementById('btn-back');
  if(back) back.onclick = ()=>{ currentView = {name:'list'}; render(); };

  const addMemberBtn = document.getElementById('btn-add-member');
  if(addMemberBtn) addMemberBtn.onclick = ()=>{ currentView.modal='addMember'; render(); };

  const typeSelect = document.getElementById('f-type');
  if(typeSelect) typeSelect.onchange = (e)=>{
    document.getElementById('child-fields').style.display = e.target.value==='child'?'block':'none';
    document.getElementById('parent-fields').style.display = e.target.value==='parent'?'block':'none';
  };

  const modalClose = document.getElementById('modal-close');
  if(modalClose) modalClose.onclick = ()=>{ delete currentView.modal; render(); };
  const modalBg = document.getElementById('modal-bg');
  if(modalBg) modalBg.onclick = (e)=>{ if(e.target.id==='modal-bg'){ delete currentView.modal; render(); } };

  const saveMemberBtn = document.getElementById('save-member');
  if(saveMemberBtn) saveMemberBtn.onclick = async ()=>{
    const type = document.getElementById('f-type').value;
    const name = document.getElementById('f-name').value.trim();
    if(!name){ showToast('이름을 입력해주세요'); return; }
    const data = { type, name };
    if(type==='child'){
      data.birthDate = document.getElementById('f-birth').value || null;
      data.gender = document.getElementById('f-gender').value;
    } else {
      const h = document.getElementById('f-height').value;
      const t = document.getElementById('f-target').value;
      data.height = h ? parseFloat(h) : null;
      data.targetWeight = t ? parseFloat(t) : null;
    }
    await addMember(data);
    delete currentView.modal;
    showToast('가족 구성원을 추가했어요');
  };

  const addRecordBtn = document.getElementById('btn-add-record');
  if(addRecordBtn) addRecordBtn.onclick = ()=>{ currentView.modal='addRecord'; render(); };

  const saveRecordBtn = document.getElementById('save-record');
  if(saveRecordBtn) saveRecordBtn.onclick = async ()=>{
    const date = document.getElementById('r-date').value;
    const heightEl = document.getElementById('r-height');
    const height = heightEl ? heightEl.value : '';
    const weight = document.getElementById('r-weight').value;
    if(!date || (!height && !weight)){ showToast('날짜와 기록할 값을 입력해주세요'); return; }
    const data = { date };
    if(height) data.height = parseFloat(height);
    if(weight) data.weight = parseFloat(weight);
    await addRecord(currentView.memberId, data);
    delete currentView.modal;
    showToast('기록을 저장했어요');
  };

  document.querySelectorAll('[data-del-record]').forEach(elm=>{
    elm.onclick = async ()=>{
      const [memberId, recordId] = elm.dataset.delRecord.split('|');
      if(confirm('이 기록을 삭제할까요?')){
        await removeRecord(memberId, recordId);
        showToast('기록을 삭제했어요');
      }
    };
  });

  const editMemberBtn = document.getElementById('btn-edit-member');
  if(editMemberBtn) editMemberBtn.onclick = ()=>{ currentView.modal='editMember'; render(); };

  const saveEditBtn = document.getElementById('save-edit-member');
  if(saveEditBtn) saveEditBtn.onclick = async ()=>{
    const m = members.find(x=>x.id===currentView.memberId);
    const name = document.getElementById('e-name').value.trim();
    if(!name){ showToast('이름을 입력해주세요'); return; }
    const data = { name };
    if(m.type==='child'){
      data.birthDate = document.getElementById('e-birth').value || null;
      data.gender = document.getElementById('e-gender').value;
    } else {
      const h = document.getElementById('e-height').value;
      const t = document.getElementById('e-target').value;
      data.height = h ? parseFloat(h) : null;
      data.targetWeight = t ? parseFloat(t) : null;
    }
    await updateMember(currentView.memberId, data);
    delete currentView.modal;
    showToast('프로필을 수정했어요');
  };

  const delMemberBtn = document.getElementById('btn-del-member');
  if(delMemberBtn) delMemberBtn.onclick = async ()=>{
    if(confirm(`${members.find(m=>m.id===currentView.memberId)?.name}님을 삭제할까요? 모든 기록도 함께 사라져요.`)){
      await removeMember(currentView.memberId);
      currentView = {name:'list'};
      showToast('삭제했어요');
    }
  };
}

listenMembers();
</script>
